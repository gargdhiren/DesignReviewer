# ===============================
# GROQ - Fast LLM API (OpenAI-compatible)
# Activate with: --spring.profiles.active=local,grok
# ===============================
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Disable Ollama auto-configuration so beans don't conflict
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration
