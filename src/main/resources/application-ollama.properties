# ===============================
# OLLAMA - Local AI
# Activate with: --spring.profiles.active=local,ollama
# ===============================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=phi3
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Disable OpenAI auto-configuration so beans don't conflict
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
